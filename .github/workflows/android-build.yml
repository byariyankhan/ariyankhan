# Builds the Android app bundle, signs it with the upload key, and hands it back as an artifact.
#
# Why this exists. The bundle used to be built by hand and signed on a laptop with jarsigner, which is three
# manual steps for every fix and one of them — remembering to raise versionCode — is the step Play rejects an
# upload for. Here the version comes from the run number, so it can never repeat, and the signing happens with
# a key the repository has never seen.
#
# Where the key lives. Not here. Four repository secrets carry it, and the workflow writes the keystore to the
# runner's own temporary directory, uses it, and deletes it in a step that runs even when the build fails:
#
#   PUZZLE_KEYSTORE_B64       puzzle-upload.jks, base64:  base64 -w0 puzzle-upload.jks
#   PUZZLE_KEYSTORE_PASSWORD  the keystore password
#   PUZZLE_KEY_ALIAS          puzzle-upload
#   PUZZLE_KEY_PASSWORD       the key password
#
# One more is optional. Notifications need Firebase's google-services.json in android/app/, which Google does
# not treat as a secret (it is inside every APK that uses it) and which can simply be committed there. If it is
# not, GOOGLE_SERVICES_JSON_B64 (base64 -w0 google-services.json) is written onto the runner instead; with
# neither, the bundle builds without Firebase and its notifications switch stays hidden. See android/README.md.
#
# Nothing is uploaded to Play from here. The artifact is downloaded and uploaded by hand, on purpose: pushing
# straight to a track needs a service account with release rights, and that is a second key to look after for
# a saving of one drag and drop.
name: Android bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName shown to players, e.g. 1.0.1'
        required: true
        default: '1.0.1'
      track_note:
        description: 'What changed, for your own reference in the artifact name'
        required: false
        default: ''
      debug_apk:
        description: 'Build a debug APK instead of the signed bundle: no upload key needed, for a test phone or to check the code compiles'
        type: boolean
        required: false
        default: false
      check_signing:
        description: 'Only check the four signing secrets against each other and print what is wrong (sizes, hashes, yes/no answers -- never a secret), then stop'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17, which is what the Android plugin compiles against
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner ships an Android SDK but not necessarily the platform this app targets. sdkmanager is
      # already on PATH there, so this adds only what is missing and stays a first-party dependency.
      - name: Android SDK 36
        run: |
          # The runner image is not promised to keep sdkmanager on the PATH (ubuntu-latest moved and it went),
          # so it is found where the SDK keeps it, and fetched from Google when the image has none at all.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools" && cd "$SDK/cmdline-tools"
            curl -sSLo tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q tools.zip && rm tools.zip && rm -rf latest && mv cmdline-tools latest
            cd "$GITHUB_WORKSPACE"
          fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # versionCode has to rise and never repeat. run_number does exactly that, and the +1 steps over the 1
      # that the first hand-built bundle already spent on the internal track.
      - name: Work out the version
        id: ver
        run: |
          echo "code=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Unpack the upload key
        if: ${{ !inputs.debug_apk }}
        env:
          KEYSTORE_B64: ${{ secrets.PUZZLE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::PUZZLE_KEYSTORE_B64 is not set. Add the four repository secrets first (see the header of this file)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks" || { echo "::error::the secret did not decode to a keystore"; exit 1; }

      # A signing failure says "keystore password was incorrect" whether the password is wrong, has a stray
      # newline, or the keystore bytes are not the ones on the laptop; the build log cannot tell which. This
      # step can, and prints nothing that is secret: lengths, a hash to compare with `sha256sum` at home,
      # the keystore type, and yes/no for each password against the file.
      - name: Check the signing secrets against each other
        if: ${{ inputs.check_signing && !inputs.debug_apk }}
        env:
          KEYSTORE_B64: ${{ secrets.PUZZLE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PUZZLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PUZZLE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PUZZLE_KEY_PASSWORD }}
        run: |
          set +e
          KS="$RUNNER_TEMP/upload.jks"
          echo "keystore file: $(stat -c %s "$KS") bytes, sha256 $(sha256sum "$KS" | cut -c1-64)"
          echo "  compare with, on the laptop:  sha256sum puzzle-upload.jks"
          echo "base64 secret: ${#KEYSTORE_B64} characters; newlines inside: $(printf '%s' "$KEYSTORE_B64" | tr -cd '\n' | wc -c); ends with whitespace: $([[ "$KEYSTORE_B64" =~ [[:space:]]$ ]] && echo yes || echo no)"
          echo "store password: ${#KS_PASS} characters; ends with whitespace/newline: $([[ "$KS_PASS" =~ [[:space:]]$ ]] && echo YES || echo no); starts with whitespace: $([[ "$KS_PASS" =~ ^[[:space:]] ]] && echo YES || echo no)"
          echo "key password:   ${#KEY_PASS} characters; ends with whitespace/newline: $([[ "$KEY_PASS" =~ [[:space:]]$ ]] && echo YES || echo no); same as the store password: $([ "$KEY_PASS" = "$KS_PASS" ] && echo yes || echo no)"
          echo "key alias:      ${#KEY_ALIAS} characters; ends with whitespace/newline: $([[ "$KEY_ALIAS" =~ [[:space:]]$ ]] && echo YES || echo no)"
          echo "file starts with: $(head -c 4 "$KS" | od -An -tx1 | tr -d ' ')  (feedfeed = JKS, 3082 = PKCS12)"
          if keytool -list -keystore "$KS" -storepass "$KS_PASS" > "$RUNNER_TEMP/list.txt" 2>&1; then
            echo "store password opens the keystore: yes"
            grep -i "keystore type\|entries" "$RUNNER_TEMP/list.txt" | head -3
            if grep -qi "^$KEY_ALIAS," "$RUNNER_TEMP/list.txt"; then echo "alias found in the keystore: yes"; else echo "alias found in the keystore: NO"; echo "aliases present (names only):"; grep -i "PrivateKeyEntry" "$RUNNER_TEMP/list.txt" | cut -d, -f1; fi
            # -certreq needs the private key, so it is a real test of the key password on a JKS store. On a PKCS12
            # store keytool ignores a different -keypass (it warns and uses the store password), so there the one
            # thing that matters is the "same as the store password" line above: bundletool uses both.
            if keytool -certreq -alias "$KEY_ALIAS" -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" -file "$RUNNER_TEMP/req.csr" > /dev/null 2>&1; then echo "key password opens the key (JKS) / key readable (PKCS12): yes"; else echo "key password opens the key: NO"; fi
            rm -f "$RUNNER_TEMP/req.csr"
          else
            echo "store password opens the keystore: NO"
            # only keytool's own reason, matched against a short list, so nothing typed by a person is echoed
            grep -o 'keystore password was incorrect\|Keystore was tampered with, or password was incorrect\|Invalid keystore format\|Integrity check failed' "$RUNNER_TEMP/list.txt" | head -1 || echo "(keytool gave a reason outside the known list)"
          fi
          rm -f "$RUNNER_TEMP/list.txt" "$KS"
          echo "::notice::Signing check done. Nothing was built."
          exit 0

      - name: Firebase configuration, when it is a secret rather than a file
        if: ${{ !inputs.check_signing }}
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -s android/app/google-services.json ]; then echo "google-services.json is in the checkout"; exit 0; fi
          if [ -z "$GS_B64" ]; then
            echo "::warning::no android/app/google-services.json and no GOOGLE_SERVICES_JSON_B64 secret: this bundle cannot receive notifications"
            exit 0
          fi
          printf '%s' "$GS_B64" | base64 -d > android/app/google-services.json
          python3 -c 'import json; json.load(open("android/app/google-services.json"))' \
            || { echo "::error::GOOGLE_SERVICES_JSON_B64 did not decode to a JSON file"; exit 1; }
          echo "google-services.json written from the secret"

      - name: Build the debug APK
        if: ${{ inputs.debug_apk }}
        working-directory: android
        env:
          PUZZLE_VERSION_CODE: ${{ steps.ver.outputs.code }}
          PUZZLE_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Keep the debug APK
        if: ${{ inputs.debug_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-debug-${{ github.event.inputs.version_name }}-${{ steps.ver.outputs.code }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build the bundle
        if: ${{ !inputs.debug_apk && !inputs.check_signing }}
        working-directory: android
        env:
          PUZZLE_KEYSTORE: ${{ runner.temp }}/upload.jks
          PUZZLE_KEYSTORE_PASSWORD: ${{ secrets.PUZZLE_KEYSTORE_PASSWORD }}
          PUZZLE_KEY_ALIAS: ${{ secrets.PUZZLE_KEY_ALIAS }}
          PUZZLE_KEY_PASSWORD: ${{ secrets.PUZZLE_KEY_PASSWORD }}
          PUZZLE_VERSION_CODE: ${{ steps.ver.outputs.code }}
          PUZZLE_VERSION_NAME: ${{ github.event.inputs.version_name }}
        # The bundle is what Play takes; the APK, signed with the same upload key, is what a phone takes
        # straight from here for a try before the upload. Both from one build.
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      # A bundle that is not signed, or is signed with the wrong key, looks fine until Play refuses it. Say so
      # here instead, where the run is still on screen.
      - name: Check it is signed, carries its splash, and say what with
        if: ${{ !inputs.debug_apk && !inputs.check_signing }}
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)$' || { echo "::error::the bundle came out unsigned"; exit 1; }
          # A splash resource the shrinker took is an app that dies on launch, and only in the shipped build: the
          # splash brains (res/drawable/splash_mark*.xml, named from the Theme.App.Starting styles) are held by
          # those styles and by res/raw/keep.xml, and this is the check that says so before anybody installs it.
          for mark in splash_mark splash_mark_night splash_mark_mint; do
            unzip -l "$AAB" | grep -qE "res/drawable[^/]*/${mark}\.xml" || { echo "::error::${mark}.xml is missing — resource shrinking took it; check app/src/main/res/raw/keep.xml"; exit 1; }
          done
          echo "versionCode ${{ steps.ver.outputs.code }} · versionName ${{ github.event.inputs.version_name }}"
          keytool -printcert -jarfile "$AAB" | grep -E 'Owner:|SHA256:' || true

      - name: Keep it
        if: ${{ !inputs.debug_apk && !inputs.check_signing }}
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-${{ github.event.inputs.version_name }}-${{ steps.ver.outputs.code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # The same build as an installable APK, signed with the upload key: for a phone to try before the bundle
      # goes to Play. It will not install over a copy Play installed (Play signs with its own key); uninstall
      # that first, or use a phone that has none.
      - name: Keep the APK too
        if: ${{ !inputs.debug_apk && !inputs.check_signing }}
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-${{ github.event.inputs.version_name }}-${{ steps.ver.outputs.code }}-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Runs whatever happened above, because a key left on a runner is a key left somewhere.
      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
