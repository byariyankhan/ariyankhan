# Arrow Atlas operations on the VPS, over SSH, one mode at a time.
#
# This exists so the post-migration work is done by something reviewable and repeatable rather than by
# pasted shell. Every mode is explicit about what it touches, and nothing here names a container, path or
# volume that is not Arrow Atlas's: ASR, Bookween and the portfolio are never addressed by any command below.
#
#   inspect        Reads. Containers, PostgreSQL row counts, gold and ledger agreement, where the legacy
#                  SQLite data still is, what backups exist, what nginx currently serves. Changes nothing.
#   backup-verify  Takes one fresh pg_dump and restores it into a scratch database to prove it works.
#                  This is the gate: no deletion happens until it passes.
#   cleanup        Deletes the legacy artifacts, and only those. Needs confirm=DELETE.
#   deploy         Recreates arrow-atlas-api (it re-fetches the repository at start) and installs the
#                  nginx snippet from this checkout, after `nginx -t` accepts it and the current one is
#                  backed up. Needs confirm=DEPLOY.
#   deploy-site    Ships the page, the stylesheet and the client by restarting ariyankhan-web alone, which
#                  re-fetches main. The game's backend, its routing and its socket are not touched — most
#                  changes to this game are to its client, and those should not cost a rebuild of the API or
#                  twenty seconds of nobody being able to play. Needs confirm=DEPLOY.
#   web-revive     Puts this checkout into ariyankhan-web and then restarts it, so the entrypoint that lives in
#                  the checkout is what starts Apache. What to run when the site answers 500 on every page
#                  because a recreate started Apache before the files were there and the modules .htaccess
#                  needs were never enabled. Needs confirm=DEPLOY.
#   web-look       Reads. What ariyankhan-web is doing: its state, its mounts, what is actually in the document
#                  root, what it answers on its own loopback, whether Apache accepts its configuration, and the
#                  tail of its error log. For when the site answers an error and the reason is in a log nobody
#                  here can otherwise read. Anything that could be a credential is masked. Changes nothing.
#   logs           Reads. What arrow-atlas-api says about itself: its state, its restart count and last exit
#                  code, the tail of its log and its last health probes. For when inspect says "restarting"
#                  and the reason is in a log nobody here can otherwise read.
#   push-source    Sends this checkout to the VPS over the same connection, unpacks it into the volume the
#                  API builds from, installs the compose file that came with it and starts the API from it.
#                  What to run while the repository cannot be read without a key, since the API's own start
#                  fetches from GitHub. Touches no .env and no other project. Needs confirm=DEPLOY.
#   web-safe-fetch Replaces one thing in hPanel's own compose file for ariyankhan-web: the start command that
#                  empties the document root before fetching, which is how a restart it cannot fetch through
#                  would leave the site with nothing to serve. Everything else in that file is left byte for
#                  byte as it is, it refuses unless the command is the one it expects, it validates before
#                  applying, and it puts the backup back if the container does not come up. Needs
#                  confirm=DEPLOY, and is a no-op once done.
#   rename-infra   The last of the rename: the containers, volumes, networks, compose project, PostgreSQL
#                  database and role, and the host's backup directory all take the game's name. Takes and
#                  restores a backup before it starts, copies the data rather than moving it, and deletes no
#                  volume — going back is putting the old compose file back. Needs confirm=RENAME.
#   finish-rename  Renames the PostgreSQL role when rename-infra could not: a role cannot be renamed by a
#                  session connected as it, so this does it from a temporary superuser and then restarts the
#                  API. Idempotent. Needs confirm=RENAME.
#   drop-old-volumes  Removes the four volumes rename-infra left behind, and only those. Checks first that
#                  the renamed service is healthy, that every balance still matches its ledger, that a dump
#                  exists on the host outside Docker, and that no container references the volume. This is
#                  the one step that cannot be undone. Needs confirm=DELETE.
#   drop-orphan-volumes  Removes anonymous volumes (a 64-hex name, which is Docker's own, never anybody
#                  else's) that no container refers to and that are empty. Keeps and says so for any that
#                  fail either test. Needs confirm=DELETE.
#   retire-site-data  Copies the one file out of ariyankhan_site_data to /var/backups/ariyankhan-site, checks
#                  the copy, and then removes the volume. Says what it would take to remove ariyankhan_aa-data
#                  and does not attempt it. Needs confirm=DELETE.
#   web-drop-aa-mount  Removes the game's dead mount from the portfolio container — the ariyankhan_aa-data
#                  volume at /var/lib/arrow-atlas, empty since the migration, and the AA_DATA_DIR variable —
#                  then the volume itself. Edits hPanel's own compose file the way web-safe-fetch does: a
#                  backup first, only lines naming those two, compose has to accept it, and because that
#                  container's document root is not a volume the checkout is put straight back after the
#                  recreate. If the site does not answer, the old file goes back. Needs confirm=DELETE.
#   volumes        Reads. Every volume, what holds it and where, how big it is, and what is inside the
#                  anonymous ones, so a volume nobody recognises can be identified before anyone deletes it.
#   health         Reads. The four containers, the API, the socket, the backup timer, and that no legacy
#                  artifact is left anywhere.
#
# No secret is ever printed: the PostgreSQL password is read inside the container from its own environment
# and passed to psql through PGPASSWORD, which never reaches a log line.
name: Puzzle ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        required: true
        default: inspect
        options: [inspect, logs, web-look, web-revive, git-access, git-sync, backup-verify, cleanup, deploy, deploy-site, push-source, web-safe-fetch, rename-infra, finish-rename, drop-old-volumes, drop-orphan-volumes, retire-site-data, web-drop-aa-mount, volumes, health]
      confirm:
        description: "Type DELETE for cleanup, DEPLOY for deploy, RENAME for rename-infra. Ignored by the read-only modes."
        required: false
        default: ""
      domain:
        description: "Domain to check from the VPS itself"
        required: false
        default: "ariyankhan.com"

permissions:
  contents: read

jobs:
  ops:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse an unconfirmed destructive mode
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in
            cleanup|drop-old-volumes|drop-orphan-volumes|retire-site-data|web-drop-aa-mount) [ "${{ inputs.confirm }}" = "DELETE" ] || { echo "::error::${{ inputs.mode }} needs confirm=DELETE"; exit 1; } ;;
            deploy|deploy-site|push-source|web-safe-fetch|web-revive) [ "${{ inputs.confirm }}" = "DEPLOY" ] || { echo "::error::${{ inputs.mode }} needs confirm=DEPLOY"; exit 1; } ;;
            rename-infra|finish-rename) [ "${{ inputs.confirm }}" = "RENAME" ] || { echo "::error::${{ inputs.mode }} needs confirm=RENAME"; exit 1; } ;;
            *) echo "read-only mode, no confirmation needed" ;;
          esac

      - name: Open the connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY; do
            eval "v=\${$name:-}"
            [ -n "${v:-}" ] || { echo "::error::$name is not set (Settings -> Secrets and variables -> Actions)"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          # A single keyscan is not a reliable way to open this: it timed out once from a runner while the
          # same command had worked from another minutes earlier, and a host that takes a moment to answer a
          # new address is not a reason to abandon a run. Four tries, widening, and it says which one worked.
          for try in 1 2 3 4; do
            ssh-keyscan -T 20 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
            if [ -s ~/.ssh/known_hosts ]; then
              [ "$try" = "1" ] || echo "  (the host key came back on attempt $try)"
              break
            fi
            echo "  no host key yet (attempt $try)"
            sleep $(( try * 5 ))
          done
          [ -s ~/.ssh/known_hosts ] || { echo "::error::no host key from the VPS on port 22 after four tries — is SSH reachable from GitHub's runners?"; exit 1; }
          ssh-keygen -lf ~/.ssh/known_hosts | sed 's/^/  host key  /'

      # push-source is the one mode that carries the repository itself. The API normally fetches its own
      # source from GitHub when it starts, which needs the repository to be readable without a key; while it
      # is not, this connection is the way in. Everything but the working tree is left behind, and .git most
      # of all — the VPS has no business holding the history.
      - name: Send this checkout
        if: inputs.mode == 'push-source' || inputs.mode == 'web-safe-fetch' || inputs.mode == 'web-drop-aa-mount' || inputs.mode == 'web-revive'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          tar -czf /tmp/arrow-atlas-site.tgz --exclude=./.git .
          ls -lh /tmp/arrow-atlas-site.tgz | sed 's/^/  /'
          scp -i ~/.ssh/vps -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
              /tmp/arrow-atlas-site.tgz "$VPS_USER@$VPS_HOST:/tmp/arrow-atlas-site.tgz"
          echo "  sent"

      - name: ${{ inputs.mode }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MODE: ${{ inputs.mode }}
          DOMAIN: ${{ inputs.domain }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # -e and pipefail both matter: without them `ssh ... | tee` reports tee's status and a failed remote
          # command leaves the job green. A check that cannot fail is not a check.
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/vps -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
               -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20)

          # The nginx snippet from this checkout travels with the deploy so the VPS never has to hold a
          # git clone for it. Other modes send an empty file and never read it.
          SNIPPET=/dev/null
          if [ "$MODE" = "deploy" ]; then SNIPPET=games/puzzle/deploy/nginx-puzzle.conf; fi
          base64 -w0 < "$SNIPPET" > /tmp/snippet.b64

          # The variables are set on the remote side of the connection: an `env:` block here would only
          # reach the runner. base64 keeps the snippet on one line and out of the shell's way.
          "${SSH[@]}" "$VPS_USER@$VPS_HOST" \
            "MODE='$MODE' DOMAIN='$DOMAIN' CONFIRM='$CONFIRM' SNIPPET_B64='$(cat /tmp/snippet.b64)' bash -s" \
            < .github/scripts/puzzle-vps.sh

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/vps ~/.ssh/known_hosts
