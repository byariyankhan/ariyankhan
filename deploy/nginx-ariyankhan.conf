# Host-level nginx server block for the shared Hostinger VPS.
# Routes ariyankhan.com and youtube.ariyankhan.com -> the ariyankhan-web
# container (127.0.0.1:${WEB_PORT}). One container serves both: nginx passes the
# Host header through and the site's .htaccess gives the subdomain its own
# document root (/youtube). Adding another subdomain is one more name here.
#
# Install (as root, in hPanel Web console):
#   cp /var/www/ariyankhan-src/deploy/nginx-ariyankhan.conf /etc/nginx/sites-available/ariyankhan.conf
#   ln -s /etc/nginx/sites-available/ariyankhan.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Then, once DNS points here:
#   certbot --nginx -d ariyankhan.com -d www.ariyankhan.com -d youtube.ariyankhan.com
# (Behind Cloudflare's proxy the edge certificate already covers the subdomain;
#  this one is for the origin.)

# Cloudflare (or any upstream proxy) already tells us the visitor's scheme;
# fall back to ours. Apache's .htaccess reads this to avoid a redirect loop.
map $http_x_forwarded_proto $ariyankhan_fwd_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    listen [::]:80;
    server_name ariyankhan.com www.ariyankhan.com youtube.ariyankhan.com;

    client_max_body_size 32m;

    # The game runs as its own Docker project on 127.0.0.1:8760 and owns these paths. Keeping its routing in
    # its own file means moving the game to a domain of its own later is a matter of including this same snippet in
    # that server block instead of this one. Requires /etc/nginx/conf.d/puzzle-map.conf for the map.
    include /etc/nginx/snippets/puzzle.conf;

    # Everything else is the portfolio and the youtube subdomain, unchanged.
    location / {
        proxy_pass         http://127.0.0.1:8747;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $ariyankhan_fwd_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
