# Host-level nginx server block for the shared Hostinger VPS.
# Routes ariyankhan.com -> the ariyankhan-web container (127.0.0.1:${WEB_PORT}).
#
# Install (as root, in hPanel Web console):
#   cp /var/www/ariyankhan-src/deploy/nginx-ariyankhan.conf /etc/nginx/sites-available/ariyankhan.conf
#   ln -s /etc/nginx/sites-available/ariyankhan.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Then, once DNS points here:
#   certbot --nginx -d ariyankhan.com -d www.ariyankhan.com

# Cloudflare (or any upstream proxy) already tells us the visitor's scheme;
# fall back to ours. Apache's .htaccess reads this to avoid a redirect loop.
map $http_x_forwarded_proto $ariyankhan_fwd_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    listen [::]:80;
    server_name ariyankhan.com www.ariyankhan.com;

    client_max_body_size 32m;

    location / {
        proxy_pass         http://127.0.0.1:8747;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $ariyankhan_fwd_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
