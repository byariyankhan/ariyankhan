# ariyankhan.com — self-contained Docker Compose project for a shared VPS.
#
# One container, no public port. `web` (php:8.4-apache) downloads the site
# from GitHub as a tarball on every start (SITE_BRANCH, default main), runs
# deploy/web-entrypoint.sh, and listens on 127.0.0.1:${WEB_PORT} (default
# 8747). The VPS's host nginx routes ariyankhan.com to that port. Almost everything is
# stateless (static pages + a PHP contact form); the one exception is the Arrow
# Atlas account database, a SQLite file in the aa-data volume. Moving to another
# VPS is: copy that volume, run this compose there, flip DNS. Nothing is shared with other sites.
#
# Redeploy = re-run the project (container restarts → fetches latest code).
#
# Environment (Docker Manager → project env / .env):
#   WEB_PORT, SITE_BRANCH,
#   SITE_URL, TO_EMAIL, SMTP_HOST, SMTP_USER, SMTP_PASS, SMTP_PORT,
#   GOOGLE_CLIENT_ID (Arrow Atlas sign-in; leave empty to offer no sign-in),
#
# Dedicated VPS with nothing else on :80/:443 → deploy/docker-compose.standalone.yml

services:
  web:
    image: php:8.4-apache
    container_name: ariyankhan-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8747}:80"
    environment:
      SITE_BRANCH: ${SITE_BRANCH:-main}
      SITE_URL: ${SITE_URL:-https://ariyankhan.com}
      TO_EMAIL: ${TO_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      ALLOW_SELF_SIGNED: ${ALLOW_SELF_SIGNED:-}
      # Arrow Atlas accounts (games/api/): the SQLite file lives in the volume below, never in the web root,
      # which every deploy wipes. GOOGLE_CLIENT_ID switches Google sign-in on; empty means no sign-in offered.
      AA_DATA_DIR: /var/lib/arrow-atlas
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - aa-data:/var/lib/arrow-atlas
    command:
      - bash
      - -c
      - |
        set -e
        echo "[deploy] fetching branch $$SITE_BRANCH"
        find /var/www/html -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        curl -fsSL "https://codeload.github.com/byariyankhan/ariyankhan/tar.gz/refs/heads/$$SITE_BRANCH" \
          | tar -xz --strip-components=1 -C /var/www/html
        echo "[deploy] fetched $$(date -u)"
        exec bash /var/www/html/deploy/web-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H 'X-Forwarded-Proto: https' http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  aa-data:
