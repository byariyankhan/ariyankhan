# ariyankhan.com — self-contained Docker Compose project for a shared VPS.
#
# One container, no public port. `web` (php:8.4-apache) downloads the site
# from GitHub as a tarball on every start (SITE_BRANCH, default main), runs
# deploy/web-entrypoint.sh, and listens on 127.0.0.1:${WEB_PORT} (default
# 8747). The VPS's host nginx routes ariyankhan.com to that port. This container
# is entirely stateless: static pages and a PHP contact form, nothing to keep.
# Arrow Atlas used to put a SQLite file in a volume here; it has its own service
# on PostgreSQL now (games/puzzle/deploy) and this container holds no data
# for it. Moving to another VPS is: run this compose there, flip DNS.
#
# Redeploy = re-run the project (container restarts → fetches latest code).
#
# Environment (Docker Manager → project env / .env):
#   WEB_PORT, SITE_BRANCH,
#   SITE_URL, TO_EMAIL, FROM_EMAIL, FROM_NAME, SMTP_HOST, SMTP_USER, SMTP_PASS, SMTP_PORT
#
# Dedicated VPS with nothing else on :80/:443 → deploy/docker-compose.standalone.yml

services:
  web:
    image: php:8.4-apache
    container_name: ariyankhan-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8747}:80"
    environment:
      SITE_BRANCH: ${SITE_BRANCH:-main}
      # Only needed while the repository is private; a read-only contents token, set in hPanel, never here.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SITE_URL: ${SITE_URL:-https://ariyankhan.com}
      TO_EMAIL: ${TO_EMAIL:-}
      # The address the message is from, which is not the account the relay signs in as. It has to be one this
      # domain publishes (SPF/DKIM at the relay), or receiving servers treat the mail as forged.
      FROM_EMAIL: ${FROM_EMAIL:-}
      FROM_NAME: ${FROM_NAME:-ariyankhan.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      ALLOW_SELF_SIGNED: ${ALLOW_SELF_SIGNED:-}
    command:
      - bash
      - -c
      - |
        set -e
        # Two ways in, because the repository is not always readable without a key: with GITHUB_TOKEN set it
        # is GitHub's API, without one the public tarball. The token lives in the environment this container
        # is given, never in this file.
        fetch() {
          if [ -n "$${GITHUB_TOKEN:-}" ]; then
            curl -fsSL -H "Authorization: Bearer $$GITHUB_TOKEN" \
              "https://api.github.com/repos/byariyankhan/ariyankhan/tarball/$$SITE_BRANCH"
          else
            curl -fsSL "https://codeload.github.com/byariyankhan/ariyankhan/tar.gz/refs/heads/$$SITE_BRANCH"
          fi
        }
        echo "[deploy] fetching branch $$SITE_BRANCH"
        # Unpacked beside the site and swapped in whole. Emptying /var/www/html first and fetching afterwards
        # means a bad minute at GitHub leaves the site with no files at all and the container restarting.
        rm -rf /var/www/.next-site && mkdir -p /var/www/.next-site
        if fetch | tar -xz --strip-components=1 -C /var/www/.next-site && [ -f /var/www/.next-site/index.html ]; then
          find /var/www/html -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          (cd /var/www/.next-site && tar -cf - .) | (cd /var/www/html && tar -xf -)
          echo "[deploy] fetched $$(date -u)"
        elif [ -f /var/www/html/index.html ]; then
          echo "[deploy] could not fetch $$SITE_BRANCH; serving the copy already here"
        else
          echo "[deploy] could not fetch $$SITE_BRANCH and there is nothing here to serve"
          exit 1
        fi
        rm -rf /var/www/.next-site
        exec bash /var/www/html/deploy/web-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H 'X-Forwarded-Proto: https' http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
