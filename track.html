  <body>
    <div id="stars"></div>

    <site-nav data-page="subpage"></site-nav>

    <main class="tracker-page">
      <div class="tracker-hero">
        <div class="tag-pill">Track Order</div>
        <h1 class="section-title">Track Your <span class="yl">Project</span></h1>
        <p class="section-desc">
          Enter the tracking code you were given to see your project's current stage.
        </p>

        <form class="tracker-form" id="trackerForm" novalidate>
          <label class="tracker-field" for="trackerCode">
            <span>Tracking Code</span>
            <input
              type="text"
              id="trackerCode"
              name="code"
              placeholder="e.g. 7K4M-9XPQ"
              autocomplete="off"
              autocapitalize="characters"
              maxlength="20"
              required
            />
          </label>
          <button type="submit" class="tracker-btn" id="trackerSubmit">Track Project</button>
        </form>

        <p class="tracker-error" id="trackerError" hidden></p>

        <div class="tracker-result" id="trackerResult" hidden>
          <p class="tracker-result-title" id="trackerProjectLabel"></p>
          <p class="tracker-result-note" id="trackerProjectNote" hidden></p>
          <div class="tracker-hstepper" id="trackerStages"></div>
        </div>
      </div>
