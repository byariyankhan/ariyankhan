# Arrow Atlas routing, as an nginx snippet.
#
# It lives in its own file on purpose. Today it is included inside the ariyankhan.com server block, so the game
# is served from the same names it always was. The day Arrow Atlas gets arrowatlas.com, this same file is
# included in that server block instead and nothing inside it changes.
#
# Install (as root):
#   mkdir -p /etc/nginx/snippets
#   cp games/arrow-atlas/deploy/nginx-arrow-atlas.conf /etc/nginx/snippets/arrow-atlas.conf
#   # ariyankhan.conf already carries: include /etc/nginx/snippets/arrow-atlas.conf;
#   nginx -t && systemctl reload nginx
#
# Requires, once, in the http{} block (see nginx-arrow-atlas-map.conf):
#   map $http_upgrade $arrow_atlas_upgrade { default upgrade; '' close; }

# ── The live socket ──
location /ws/arrow-atlas {
    proxy_pass         http://127.0.0.1:8760;
    proxy_http_version 1.1;

    # The upgrade dance. Without these two the handshake is answered as an ordinary request and the socket
    # never opens; `close` for an empty Upgrade keeps ordinary requests through this path behaving normally.
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $arrow_atlas_upgrade;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $ariyankhan_fwd_proto;

    # A game socket is quiet between rooms and the server pings every 30s; an hour of read timeout means a
    # player waiting in a lobby is never cut off by the proxy rather than by the game.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;
    proxy_buffering     off;   # events must reach the player as they happen, not when a buffer fills
}

# ── The versioned API ──
location /api/arrow-atlas/ {
    proxy_pass         http://127.0.0.1:8760;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $ariyankhan_fwd_proto;
    proxy_set_header   Connection        "";     # keep-alive to the upstream, not a per-request connection
    proxy_read_timeout 30s;

    # The API decides what may be cached, and the answer is always "nothing": it is all about right now.
    proxy_no_cache     1;
    proxy_cache_bypass 1;
}

# ── Health ──
# Reachable from the host only; the outside world has no business reading container statistics.
location = /api/arrow-atlas/health {
    allow 127.0.0.1;
    allow ::1;
    deny  all;
    proxy_pass       http://127.0.0.1:8760/health;
    proxy_set_header Host $host;
}
