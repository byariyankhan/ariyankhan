# Arrow Atlas needs one map in the http{} block, which is where maps must live. Debian/Ubuntu nginx includes
# /etc/nginx/conf.d/*.conf from http{}, so this file belongs there:
#
#   cp games/puzzle/deploy/nginx-puzzle-map.conf /etc/nginx/conf.d/arrow-atlas-map.conf
#
# It turns a WebSocket handshake's `Upgrade: websocket` into `Connection: upgrade`, and leaves ordinary
# requests with `Connection: close`, which is what lets one location serve both.
map $http_upgrade $arrow_atlas_upgrade {
    default upgrade;
    ''      close;
}
