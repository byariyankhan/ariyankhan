plugins { id 'com.android.application' }

// Firebase Cloud Messaging is what carries a notification to a phone that has the game closed, and its library
// needs to know which Firebase project it belongs to. That comes from google-services.json, which Google says
// is not a secret (it is inside every APK that uses it) and which is Ariyan's to put at app/google-services.json,
// or to hand to CI as a secret -- see android/README.md. Applying the plugin without the file fails the build,
// so it is applied only when the file is there; without it the app builds exactly as before and tells the page
// that notifications are unavailable.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.ariyankhan.puzzle'
    // Google Play has required API 36 of new apps and of every update since 31 August 2026. 35 would be
    // rejected at upload. See android/README.md for the behaviour changes that come with it.
    compileSdk 36

    defaultConfig {
        applicationId 'com.ariyankhan.puzzle'
        // 24 (Android 7.0) is what Google Play's automatic protection asks of a bundle: it refused one built
        // for 23 at upload. The shell itself needs 23 (WebViewClient.onPageCommitVisible, which is how the
        // splash knows the game has painted); Android 6 phones are the only ones this leaves out.
        minSdk 24
        targetSdk 36
        // Play refuses a versionCode it has already seen, and 1 is spent. CI passes the next one in; a build
        // run by hand keeps 1, which is fine for looking at the app and wrong for uploading it.
        versionCode ((System.getenv('PUZZLE_VERSION_CODE') ?: '1') as int)
        versionName (System.getenv('PUZZLE_VERSION_NAME') ?: '1.0.0')
        resourceConfigurations += ['en']      // the game ships one language; do not carry 80 more
    }

    // The upload key reaches the build from the environment and from nowhere else. No keystore is in this
    // repository, none is written into it, and a build with none of these set simply produces an unsigned
    // bundle — which is what a local `./gradlew bundleRelease` has always produced.
    signingConfigs {
        upload {
            def ks = System.getenv('PUZZLE_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('PUZZLE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PUZZLE_KEY_ALIAS')
                keyPassword System.getenv('PUZZLE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // A different package, so a test build installs beside the one from Play instead of being refused
            // for having a different signature — and so a check of the shell never costs the real app and the
            // progress in it. The deep link will not verify under this id, since assetlinks.json names the
            // real one; everything else behaves the same.
            applicationIdSuffix '.debug'
        }
        release {
            // One activity and one library: there is very little to strip, and stripping it is still free.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed where the key is — Play App Signing holds the real one, and no keystore belongs in git.
            signingConfig System.getenv('PUZZLE_KEYSTORE') ? signingConfigs.upload : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Nothing here uses the build's own BuildConfig or resources beyond strings and colours.
    buildFeatures { buildConfig false }
}

dependencies {
    // Two libraries, and only for things the platform makes awkward rather than impossible.
    //
    // activity is ComponentActivity and OnBackPressedCallback: the supported way to intercept back such that
    // the last press still belongs to the system, which is what lets Android 16 animate the app closing.
    //
    // core is WindowCompat and the inset types. Android 16 makes every window edge-to-edge with no opt-out,
    // so the padding around the status and navigation bars is applied by hand, and it has to read the same
    // inset values on API 23 as on 36.
    //
    // android-browser-helper is gone. It was the whole app when the app was a Trusted Web Activity; the four
    // components it reached for and the crash they caused went with it.
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.core:core:1.17.0'

    // The splash screen: Android 12 and up draw one whatever the app does, and this is what lets the app say
    // what is on it (the brain, at the size and place the page will draw it), how long it stays (until the page
    // has painted) and, from Android 13, in which of the game's themes. Below 12 it draws the same thing itself.
    // 1.0.1 on purpose: the same API as the 1.2 line, with nothing under it but annotations -- 1.2 brings
    // appcompat-resources along -- and it is the version most apps in the wild are running.
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Sign-in. Google refuses its own OAuth endpoint inside a WebView, so the token is fetched natively and
    // handed to the page — credentials is the API that asks, credentials-play-services-auth is what talks to
    // Play services underneath it, and googleid is the GetGoogleIdOption and the credential it comes back as.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // The bridge the token crosses. WebViewCompat.addWebMessageListener takes origin rules, so the object is
    // injected into our own page and not into every frame the way addJavascriptInterface would — which
    // matters now and matters more when this bridge is carrying purchases.
    implementation 'androidx.webkit:webkit:1.12.1'

    // The browser, for the sign-in the phone cannot do natively: a Custom Tab of the game's own page, where
    // Google's button works, which then hands the account back through puzzle://signin (README, "Sign-in").
    implementation 'androidx.browser:browser:1.8.0'

    // AdMob. Not for drawing ads itself — the game's own AdSense tag does that — but for
    // MobileAds.registerWebView, which is the whole reason this app owns its WebView.
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Notifications. firebase-messaging is the phone's end of Firebase Cloud Messaging: it minds the
    // registration token the server addresses a phone by, receives the message when one arrives, and hands it
    // to PuzzleMessagingService, which draws it. The BOM pins every Firebase library to one release so no two
    // can disagree. It does nothing, and talks to nobody, until the player turns the switch on.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
