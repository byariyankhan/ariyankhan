plugins { id 'com.android.application' }

android {
    namespace 'com.ariyankhan.puzzle'
    // Google Play has required API 36 of new apps and of every update since 31 August 2026. 35 would be
    // rejected at upload. See android/README.md for the behaviour changes that come with it.
    compileSdk 36

    defaultConfig {
        applicationId 'com.ariyankhan.puzzle'
        // 23 is what the shell needs: WebViewClient.onPageCommitVisible, which is how the splash knows the
        // game has painted, arrived there. Everything below it is older than the WebView the game expects.
        minSdk 23
        targetSdk 36
        // Play refuses a versionCode it has already seen, and 1 is spent. CI passes the next one in; a build
        // run by hand keeps 1, which is fine for looking at the app and wrong for uploading it.
        versionCode ((System.getenv('PUZZLE_VERSION_CODE') ?: '1') as int)
        versionName (System.getenv('PUZZLE_VERSION_NAME') ?: '1.0.0')
        resourceConfigurations += ['en']      // the game ships one language; do not carry 80 more
    }

    // The upload key reaches the build from the environment and from nowhere else. No keystore is in this
    // repository, none is written into it, and a build with none of these set simply produces an unsigned
    // bundle — which is what a local `./gradlew bundleRelease` has always produced.
    signingConfigs {
        upload {
            def ks = System.getenv('PUZZLE_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('PUZZLE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PUZZLE_KEY_ALIAS')
                keyPassword System.getenv('PUZZLE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // A different package, so a test build installs beside the one from Play instead of being refused
            // for having a different signature — and so a check of the shell never costs the real app and the
            // progress in it. The deep link will not verify under this id, since assetlinks.json names the
            // real one; everything else behaves the same.
            applicationIdSuffix '.debug'
        }
        release {
            // One activity and one library: there is very little to strip, and stripping it is still free.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed where the key is — Play App Signing holds the real one, and no keystore belongs in git.
            signingConfig System.getenv('PUZZLE_KEYSTORE') ? signingConfigs.upload : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Nothing here uses the build's own BuildConfig or resources beyond strings and colours.
    buildFeatures { buildConfig false }
}

dependencies {
    // Two libraries, and only for things the platform makes awkward rather than impossible.
    //
    // activity is ComponentActivity and OnBackPressedCallback: the supported way to intercept back such that
    // the last press still belongs to the system, which is what lets Android 16 animate the app closing.
    //
    // core is WindowCompat and the inset types. Android 16 makes every window edge-to-edge with no opt-out,
    // so the padding around the status and navigation bars is applied by hand, and it has to read the same
    // inset values on API 23 as on 36.
    //
    // android-browser-helper is gone. It was the whole app when the app was a Trusted Web Activity; the four
    // components it reached for and the crash they caused went with it.
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.core:core:1.17.0'
}
