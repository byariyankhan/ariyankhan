plugins { id 'com.android.application' }

android {
    namespace 'com.ariyankhan.puzzle'
    // Google Play has required API 36 of new apps and of every update since 31 August 2026. 35 would be
    // rejected at upload. See android/README.md for the behaviour changes that come with it.
    compileSdk 36

    defaultConfig {
        applicationId 'com.ariyankhan.puzzle'
        // 23 is where Chrome's Trusted Web Activity support begins; below it the app would only ever be a
        // Custom Tab, which is not what anybody installed.
        minSdk 23
        targetSdk 36
        // Play refuses a versionCode it has already seen, and 1 is spent. CI passes the next one in; a build
        // run by hand keeps 1, which is fine for looking at the app and wrong for uploading it.
        versionCode ((System.getenv('PUZZLE_VERSION_CODE') ?: '1') as int)
        versionName (System.getenv('PUZZLE_VERSION_NAME') ?: '1.0.0')
        resourceConfigurations += ['en']      // the game ships one language; do not carry 80 more
    }

    // The upload key reaches the build from the environment and from nowhere else. No keystore is in this
    // repository, none is written into it, and a build with none of these set simply produces an unsigned
    // bundle — which is what a local `./gradlew bundleRelease` has always produced.
    signingConfigs {
        upload {
            def ks = System.getenv('PUZZLE_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('PUZZLE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PUZZLE_KEY_ALIAS')
                keyPassword System.getenv('PUZZLE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // One activity and one library: there is very little to strip, and stripping it is still free.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed where the key is — Play App Signing holds the real one, and no keystore belongs in git.
            signingConfig System.getenv('PUZZLE_KEYSTORE') ? signingConfigs.upload : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Nothing here uses the build's own BuildConfig or resources beyond strings and colours.
    buildFeatures { buildConfig false }
}

dependencies {
    // The official Trusted Web Activity host. It is the whole app: it opens the site in Chrome without the
    // browser around it, verifies Digital Asset Links, draws the splash, and hands web notifications to
    // Android's notification shade. 2.7.x is the first line that knows about Android 16's edge-to-edge
    // window and its predictive back gesture.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
